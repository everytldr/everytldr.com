name: Frontend image build

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}-frontend

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            football_key=${{ secrets.FOOTBALL_DATA_API_KEY }}
          build-args: |
            NEXT_PUBLIC_API_MOCKING=${{ vars.NEXT_PUBLIC_API_MOCKING || 'false' }}
            NEXT_PUBLIC_ADSENSE_CLIENT_ID=${{ vars.NEXT_PUBLIC_ADSENSE_CLIENT_ID }}
            NEXT_PUBLIC_ADSENSE_SLOT_ARTICLE_DETAIL=${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_ARTICLE_DETAIL }}
            NEXT_PUBLIC_FOOTER_ABOUT_URL=${{ vars.NEXT_PUBLIC_FOOTER_ABOUT_URL }}
            NEXT_PUBLIC_FOOTER_PRIVACY_URL=${{ vars.NEXT_PUBLIC_FOOTER_PRIVACY_URL }}
            NEXT_PUBLIC_FOOTER_TERMS_URL=${{ vars.NEXT_PUBLIC_FOOTER_TERMS_URL }}
            NEXT_PUBLIC_FOOTER_GITHUB_URL=${{ vars.NEXT_PUBLIC_FOOTER_GITHUB_URL }}
