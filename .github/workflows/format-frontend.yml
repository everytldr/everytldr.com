name: Frontend formatting

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/format-frontend.yml"

permissions:
  contents: write

concurrency:
  group: bot-commit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Apply eslint --fix
        working-directory: frontend
        run: pnpm lint:eslint --fix

      - name: Detect drift
        id: drift
        run: |
          if git diff --quiet -- frontend; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit formatted code (dispatch)
        if: |
          steps.drift.outputs.changed == 'true' &&
          github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend
          git commit -m "chore: apply eslint --fix"
          git push

      - name: Fail on drift (push to protected branches)
        if: |
          steps.drift.outputs.changed == 'true' &&
          github.event_name == 'push'
        run: |
          echo "::error::Frontend code is not properly formatted on $GITHUB_REF. Run 'pnpm lint:eslint --fix' in frontend/ and commit before merging."
          git --no-pager diff -- frontend
          exit 1
