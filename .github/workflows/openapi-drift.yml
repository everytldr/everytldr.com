name: OpenAPI drift check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/**"
      - "docs/openapi.json"
      - ".github/workflows/openapi-drift.yml"
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "docs/openapi.json"
      - ".github/workflows/openapi-drift.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (PR head)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Checkout (push / dispatch)
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Regenerate docs/openapi.json
        working-directory: backend
        run: ./gradlew exportOpenApi

      - name: Detect drift
        id: drift
        run: |
          if git diff --quiet -- docs/openapi.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit regenerated spec (PR / dispatch)
        if: |
          steps.drift.outputs.changed == 'true' &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository))
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/openapi.json
          git commit -m "chore: regenerate docs/openapi.json"
          git push

      - name: Approve PR
        if: |
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review ${{ github.event.pull_request.number }} \
            --approve \
            --body "OpenAPI spec is in sync with the API code."

      - name: Fail on drift (push to protected branches)
        if: |
          steps.drift.outputs.changed == 'true' &&
          github.event_name == 'push'
        run: |
          echo "::error::docs/openapi.json is out of date on $GITHUB_REF. Run './gradlew exportOpenApi' in backend/ and commit before merging."
          git --no-pager diff -- docs/openapi.json
          exit 1
