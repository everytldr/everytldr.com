name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-deploy-mono-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.ref_name }}
          filters: |
            frontend:
              - 'frontend/**'
              - 'docs/openapi.json'
              - '.github/workflows/build-deploy-mono.yml'
            backend:
              - 'backend/**'
              - '.github/workflows/build-deploy-mono.yml'
            infra:
              - 'infra/mono/**'
              - '.github/workflows/build-deploy-mono.yml'

  build-frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-frontend
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            football_key=${{ secrets.FOOTBALL_DATA_API_KEY }}
          build-args: |
            NEXT_PUBLIC_API_MOCKING=${{ vars.NEXT_PUBLIC_API_MOCKING || 'false' }}
            NEXT_PUBLIC_BLOCKED_CATEGORY_SLUGS=${{ vars.NEXT_PUBLIC_BLOCKED_CATEGORY_SLUGS }}
            NEXT_PUBLIC_ADSENSE_CLIENT_ID=${{ vars.NEXT_PUBLIC_ADSENSE_CLIENT_ID }}
            NEXT_PUBLIC_ADSENSE_SLOT_ARTICLE_DETAIL=${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_ARTICLE_DETAIL }}
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
            NEXT_PUBLIC_FOOTER_ABOUT_URL=${{ vars.NEXT_PUBLIC_FOOTER_ABOUT_URL }}
            NEXT_PUBLIC_FOOTER_PRIVACY_URL=${{ vars.NEXT_PUBLIC_FOOTER_PRIVACY_URL }}
            NEXT_PUBLIC_FOOTER_TERMS_URL=${{ vars.NEXT_PUBLIC_FOOTER_TERMS_URL }}
            NEXT_PUBLIC_FOOTER_GITHUB_URL=${{ vars.NEXT_PUBLIC_FOOTER_GITHUB_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_NAVER_SITE_VERIFICATION=${{ vars.NEXT_PUBLIC_NAVER_SITE_VERIFICATION }}
            NEXT_PUBLIC_BING_SITE_VERIFICATION=${{ vars.NEXT_PUBLIC_BING_SITE_VERIFICATION }}

  build-backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      TESTCONTAINERS_REUSE_ENABLE: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew build

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-backend
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [changes, build-frontend, build-backend]
    if: >-
      ${{ !failure() && !cancelled()
          && (needs.changes.outputs.frontend == 'true'
              || needs.changes.outputs.backend == 'true'
              || needs.changes.outputs.infra == 'true'
              || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.INFRA_MONO_HOST }}
          username: ${{ secrets.INFRA_MONO_USER }}
          key: ${{ secrets.INFRA_MONO_SSH_KEY }}
          source: infra/mono/docker-compose.yml,infra/mono/Caddyfile,infra/mono/prometheus/**,infra/mono/grafana/**
          target: /opt/everytldr
          strip_components: 2

      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.INFRA_MONO_HOST }}
          username: ${{ secrets.INFRA_MONO_USER }}
          key: ${{ secrets.INFRA_MONO_SSH_KEY }}
          script: |
            cd /opt/everytldr
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
