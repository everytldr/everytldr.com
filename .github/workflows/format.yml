name: Code formatting

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - "backend/**.java"
      - "backend/build.gradle.kts"
      - ".github/workflows/format.yml"

permissions:
  contents: write

concurrency:
  group: bot-commit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply spotless formatting
        working-directory: backend
        run: ./gradlew spotlessApply

      - name: Detect drift
        id: drift
        run: |
          if git diff --quiet -- backend; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit formatted code (dispatch)
        if: |
          steps.drift.outputs.changed == 'true' &&
          github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git commit -m "chore: apply spotless formatting"
          git push

      - name: Fail on drift (push to protected branches)
        if: |
          steps.drift.outputs.changed == 'true' &&
          github.event_name == 'push'
        run: |
          echo "::error::Backend code is not properly formatted on $GITHUB_REF. Run './gradlew spotlessApply' in backend/ and commit before merging."
          git --no-pager diff -- backend
          exit 1
