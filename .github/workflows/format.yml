name: Formatting

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - "backend/**.java"
      - "backend/build.gradle.kts"
      - ".github/workflows/format.yml"

permissions:
  contents: write

concurrency:
  group: bot-commit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.ref_name }}
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/format.yml'
            backend:
              - 'backend/**.java'
              - 'backend/build.gradle.kts'
              - '.github/workflows/format.yml'

  format-frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Apply eslint --fix
        working-directory: frontend
        run: pnpm lint:eslint --fix

      - name: Detect drift
        id: drift
        run: |
          if git diff --quiet -- frontend; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit formatted code (dispatch)
        if: |
          steps.drift.outputs.changed == 'true' &&
          github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend
          git commit -m "chore: apply eslint --fix"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push

      - name: Fail on drift (push to protected branches)
        if: |
          steps.drift.outputs.changed == 'true' &&
          github.event_name == 'push'
        run: |
          echo "::error::Frontend code is not properly formatted on $GITHUB_REF. Run 'pnpm lint:eslint --fix' in frontend/ and commit before merging."
          git --no-pager diff -- frontend
          exit 1

  format-backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply spotless formatting
        working-directory: backend
        run: ./gradlew spotlessApply

      - name: Detect drift
        id: drift
        run: |
          if git diff --quiet -- backend; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit formatted code (dispatch)
        if: |
          steps.drift.outputs.changed == 'true' &&
          github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git commit -m "chore: apply spotless formatting"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push

      - name: Fail on drift (push to protected branches)
        if: |
          steps.drift.outputs.changed == 'true' &&
          github.event_name == 'push'
        run: |
          echo "::error::Backend code is not properly formatted on $GITHUB_REF. Run './gradlew spotlessApply' in backend/ and commit before merging."
          git --no-pager diff -- backend
          exit 1
