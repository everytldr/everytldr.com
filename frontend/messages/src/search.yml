input-placeholder:
  en: "Type {min}+ characters to search"
  ko: "{min}자 이상 입력해서 검색해보세요"

trigger-placeholder:
  en: "<kbd>/</kbd> to search"
  ko: "<kbd>/</kbd>를 눌러 검색하세요"

aria-label:
  search-input:
    en: "Search"
    ko: "검색"
  clear-input:
    en: "Clear search"
    ko: "검색어 지우기"
  remove-recent:
    en: "Remove from recent"
    ko: "최근 검색에서 제거"

section:
  recent:
    en: "Recent"
    ko: "최근 검색"
  popular:
    en: "Trending"
    ko: "인기 검색어"

popular-meta:
  en: "Updated hourly"
  ko: "매시간 갱신"

empty-state:
  en: "No results for “{query}”. Try a different keyword or browse by topic."
  ko: "‘{query}’에 대한 검색 결과가 없어요. 다른 키워드로 검색하거나 주제별로 둘러보세요."

keyboard-hint:
  enter:
    en: "open"
    ko: "열기"
  escape:
    en: "close"
    ko: "닫기"
  arrows:
    en: "navigate"
    ko: "탐색"

