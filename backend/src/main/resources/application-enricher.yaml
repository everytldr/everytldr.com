everytldr:
  enricher:
    processing:
      enabled: ${ENRICHER_PROCESSING_ENABLED:false}
      batch-size: ${ENRICHER_PROCESSING_BATCH_SIZE:10}
      fixed-delay: ${ENRICHER_PROCESSING_FIXED_DELAY:30s}
      max-attempts: ${ENRICHER_PROCESSING_MAX_ATTEMPTS:3}
      retry-delay: ${ENRICHER_PROCESSING_RETRY_DELAY:10m}
      stale-timeout: ${ENRICHER_PROCESSING_STALE_TIMEOUT:15m}
    content:
      allowed-hosts: ${ENRICHER_CONTENT_ALLOWED_HOSTS:globalvoices.org,www.globalvoices.org}
      request-timeout: ${ENRICHER_CONTENT_REQUEST_TIMEOUT:5s}
      max-redirects: ${ENRICHER_CONTENT_MAX_REDIRECTS:3}
      max-body-bytes: ${ENRICHER_CONTENT_MAX_BODY_BYTES:1048576}
      min-body-chars: ${ENRICHER_CONTENT_MIN_BODY_CHARS:200}
    cache:
      category-options:
        ttl: ${ENRICHER_CACHE_CATEGORY_OPTIONS_TTL:5m}
    ai:
      gemini:
        enabled: ${ENRICHER_AI_GEMINI_ENABLED:false}
        base-url: ${ENRICHER_AI_GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
        api-key: ${GEMINI_API_KEY:}
        model: ${ENRICHER_AI_GEMINI_MODEL:gemini-3.1-flash-lite}
        request-timeout: ${ENRICHER_AI_GEMINI_REQUEST_TIMEOUT:30s}
        prompt-resource: ${ENRICHER_AI_GEMINI_PROMPT_RESOURCE:classpath:prompts/article-enrichment-system-prompt.txt}
