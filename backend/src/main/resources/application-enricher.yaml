everytldr:
  enricher:
    processing:
      enabled: ${ENRICHER_PROCESSING_ENABLED:false}
      batch-size: ${ENRICHER_PROCESSING_BATCH_SIZE:10}
      fixed-delay: ${ENRICHER_PROCESSING_FIXED_DELAY:30s}
      max-attempts: ${ENRICHER_PROCESSING_MAX_ATTEMPTS:3}
      retry:
        initial-interval: ${ENRICHER_PROCESSING_RETRY_INITIAL_INTERVAL:1m}
        multiplier: ${ENRICHER_PROCESSING_RETRY_MULTIPLIER:2.0}
        max-interval: ${ENRICHER_PROCESSING_RETRY_MAX_INTERVAL:10m}
      stale-timeout: ${ENRICHER_PROCESSING_STALE_TIMEOUT:15m}
    content:
      timeout: ${ENRICHER_CONTENT_TIMEOUT:5s}
      max-body-bytes: ${ENRICHER_CONTENT_MAX_BODY_BYTES:1048576}
      min-body-chars: ${ENRICHER_CONTENT_MIN_BODY_CHARS:200}
    cache:
      category-slugs-ttl: ${ENRICHER_CACHE_CATEGORY_SLUGS_TTL:5m}
      article-sources-ttl: ${ENRICHER_CACHE_ARTICLE_SOURCES_TTL:5m}
    ai:
      gemini:
        enabled: ${ENRICHER_AI_GEMINI_ENABLED:false}
        base-url: ${ENRICHER_AI_GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
        api-key: ${GEMINI_API_KEY:}
        model: ${ENRICHER_AI_GEMINI_MODEL:gemini-3.1-flash-lite}
        timeout: ${ENRICHER_AI_GEMINI_TIMEOUT:30s}
        prompt-path: ${ENRICHER_AI_GEMINI_PROMPT_PATH:classpath:prompts/article-enrichment-system-prompt.txt}
