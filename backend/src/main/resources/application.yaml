spring:
  profiles:
    group:
      monolith:
        - api
        - ingestor
        - enricher
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tldrtimes?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:tldrtimes}
    password: ${DB_PASSWORD:tldrtimes}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
