spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_UI_ENABLED:true}

everytldr:
  visitor:
    cookie-name: ${VISITOR_COOKIE_NAME:everytldr_visitor}
    cookie-max-age: ${VISITOR_COOKIE_MAX_AGE:365d}
    cookie-secure: ${VISITOR_COOKIE_SECURE:true}
    hash-secret: ${VISITOR_HASH_SECRET}
  client-address:
    hash-secret: ${CLIENT_ADDRESS_HASH_SECRET:local-development-client-address-secret}
  article-view:
    deduplication-ttl: ${ARTICLE_VIEW_DEDUPLICATION_TTL:24h}
    flush-enabled: ${ARTICLE_VIEW_FLUSH_ENABLED:true}
    flush-cron: ${ARTICLE_VIEW_FLUSH_CRON:0 0 * * * *}
    memory-guard:
      threshold: ${ARTICLE_VIEW_MEMORY_GUARD_THRESHOLD:0.9}
      sample-interval: ${ARTICLE_VIEW_MEMORY_GUARD_SAMPLE_INTERVAL:10s}
    flush-history-cleanup:
      retention: ${ARTICLE_VIEW_FLUSH_HISTORY_RETENTION:30d}
      interval: ${ARTICLE_VIEW_FLUSH_HISTORY_CLEANUP_INTERVAL:1d}
      batch-size: ${ARTICLE_VIEW_FLUSH_HISTORY_CLEANUP_BATCH_SIZE:1000}
  article-popularity:
    bucket-ttl: ${ARTICLE_POPULARITY_BUCKET_TTL:26h}
    bucket-lookback-hours: ${ARTICLE_POPULARITY_BUCKET_LOOKBACK_HOURS:24}
