services:
  caddy:
    image: caddy:2-alpine
    container_name: everytldr-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/caddy/sites:/etc/caddy/conf.d:ro
      - /srv/www:/srv/www:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - default
      - web
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    image: ghcr.io/everytldr/everytldr.com-frontend:latest
    restart: always
    environment:
      BACKEND_URL: http://backend:8080
    env_file:
      - .env.frontend
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  backend:
    image: ghcr.io/everytldr/everytldr.com-backend:latest
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env.backend
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s

  mysql:
    image: mysql:8.4
    container_name: everytldr-mysql
    restart: always
    env_file:
      - .env.db
    environment:
      TZ: Etc/UTC
    ports:
      - "127.0.0.1:3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --innodb-ft-server-stopword-table=everytldr/innodb_fulltext_stopwords
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    container_name: everytldr-redis
    restart: always
    mem_limit: 384m
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  prometheus:
    image: prom/prometheus
    container_name: everytldr-prometheus
    restart: always
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles

  grafana:
    image: grafana/grafana
    container_name: everytldr-grafana
    restart: always
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - .env.grafana
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

networks:
  web:
    external: true

volumes:
  mysql-data:
    name: everytldr-mysql-data
  redis-data:
    name: everytldr-redis-data
  caddy-data:
    name: everytldr-caddy-mono-data
  caddy-config:
    name: everytldr-caddy-mono-config
  prometheus-data:
    name: everytldr-prometheus-data
  grafana-data:
    name: everytldr-grafana-data
